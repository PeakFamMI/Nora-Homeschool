  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nora Grade 9 Tracker // Orbital Log</title>
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .overdrive-glow {
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.35);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqGlBTtPq0XwLFXDByPBVKVlUhy0iGLgs-HEjEyMd3ekO6uffPMgP-_3CD7644e3dE/exec"; 
    const TOTAL_WEEKS = 18;

    // Exact Monday start dates for each of the 18 academic weeks
    const WEEK_START_DATES = [
      { week: 1,  start: "2026-09-07" },
      { week: 2,  start: "2026-09-14" },
      { week: 3,  start: "2026-09-21" },
      { week: 4,  start: "2026-09-28" },
      { week: 5,  start: "2026-10-05" },
      { week: 6,  start: "2026-10-12" },
      { week: 7,  start: "2026-10-19" },
      { week: 8,  start: "2026-10-26" },
      { week: 9,  start: "2026-11-02" },
      { week: 10, start: "2026-11-09" },
      { week: 11, start: "2026-11-16" },
      { week: 12, start: "2026-11-23" },
      { week: 13, start: "2026-11-30" },
      { week: 14, start: "2026-12-07" },
      { week: 15, start: "2026-12-14" },
      { week: 16, start: "2027-01-04" },
      { week: 17, start: "2027-01-11" },
      { week: 18, start: "2027-01-18" }
    ];

    function getCalendarWeek() {
      const now = new Date();
      const todayStr =
        now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0");

      let currentWk = 1;
      for (let i = 0; i < WEEK_START_DATES.length; i++) {
        if (todayStr >= WEEK_START_DATES[i].start) {
          currentWk = WEEK_START_DATES[i].week;
        }
      }
      return currentWk;
    }

    const COURSE_META = {
      english9: {
        id: "english9",
        name: "English 9",
        sciFiName: "Xenolinguistics & Eridian Comms",
        curriculum: "The Good & The Beautiful (HS 1)",
        color: "from-amber-500 to-orange-500",
        badge: "bg-amber-500/15 text-amber-300 border-amber-500/30"
      },
      geometry: {
        id: "geometry",
        name: "Geometry",
        sciFiName: "Astrogation & Orbital Vectors",
        curriculum: "CK-12 Interactive Geometry 2.0",
        color: "from-cyan-500 to-blue-500",
        badge: "bg-cyan-500/15 text-cyan-300 border-cyan-500/30"
      },
      biology: {
        id: "biology",
        name: "Biology (with Lab)",
        sciFiName: "Astrophage & Exobiology Lab",
        curriculum: "CK-12 High School Biology",
        color: "from-emerald-500 to-teal-500",
        badge: "bg-emerald-500/15 text-emerald-300 border-emerald-500/30"
      },
      ushistory: {
        id: "ushistory",
        name: "US History",
        sciFiName: "Terran Historical Archives",
        curriculum: "EPISD / CK-12 US History",
        color: "from-purple-500 to-indigo-500",
        badge: "bg-purple-500/15 text-purple-300 border-purple-500/30"
      },
      civics: {
        id: "civics",
        name: "Civics / US Govt",
        sciFiName: "Project Hail Mary Command Protocol",
        curriculum: "EPISD / CK-12 US Government",
        color: "from-rose-500 to-pink-500",
        badge: "bg-rose-500/15 text-rose-300 border-rose-500/30"
      }
    };

    function playChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.14);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      } catch (e) {}
    }

    // Helper for JSONP calls (works reliably for both loading and saving on mobile/desktop)
    function jsonpRequest(url, params = {}) {
      return new Promise((resolve, reject) => {
        const callbackName = "jsonp_cb_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
        const script = document.createElement("script");

        const query = Object.entries({ ...params, callback: callbackName, t: Date.now() })
          .map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`)
          .join("&");

        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("Request timed out"));
        }, 12000);

        function cleanup() {
          clearTimeout(timer);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("Network error"));
        };

        const sep = url.includes("?") ? "&" : "?";
        script.src = `${url}${sep}${query}`;
        document.body.appendChild(script);
      });
    }

    function App() {
      const [persona, setPersona] = useState(() => localStorage.getItem("nora_persona") || "hailmary");
      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem("nora_script_url") || DEFAULT_SCRIPT_URL);
      const [showSettings, setShowSettings] = useState(false);
      const [tasks, setTasks] = useState([]);
      const [loading, setLoading] = useState(false);
      const [syncStatus, setSyncStatus] = useState("Idle");
      const [toast, setToast] = useState(null);

      const calendarWeek = useMemo(() => getCalendarWeek(), []);

      // Active week automatically advances if the current calendar week's tasks are 100% done
      const activeAcademicWeek = useMemo(() => {
        if (!tasks || tasks.length === 0) return calendarWeek;
        let wk = calendarWeek;
        while (wk < TOTAL_WEEKS) {
          const wkTasks = tasks.filter(t => t.week === wk);
          if (wkTasks.length > 0 && wkTasks.every(t => t.completed)) {
            wk++;
          } else {
            break;
          }
        }
        return wk;
      }, [tasks, calendarWeek]);

      const [viewMode, setViewMode] = useState("current_week");
      const [selectedWeek, setSelectedWeek] = useState(calendarWeek);
      const [selectedCourse, setSelectedCourse] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");

      const isSciFi = persona === "hailmary";

      useEffect(() => {
        localStorage.setItem("nora_persona", persona);
      }, [persona]);

      useEffect(() => {
        setSelectedWeek(activeAcademicWeek);
      }, [activeAcademicWeek]);

      const triggerToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const fetchTasks = async (urlToUse = scriptUrl) => {
        if (!urlToUse) return;
        setLoading(true);
        setSyncStatus("Syncing...");
        try {
          const data = await jsonpRequest(urlToUse);
          setLoading(false);
          if (data && data.status === "ok" && Array.isArray(data.tasks)) {
            setTasks(data.tasks);
            localStorage.setItem("nora_cached_tasks", JSON.stringify(data.tasks));
            setSyncStatus("Synced ✓");
          } else {
            setSyncStatus("Check Sheet Script");
          }
        } catch (err) {
          setLoading(false);
          setSyncStatus("Offline (Cached)");
          const cached = localStorage.getItem("nora_cached_tasks");
          if (cached) {
            try { setTasks(JSON.parse(cached)); } catch (e) {}
          }
        }
      };

      useEffect(() => {
        const cached = localStorage.getItem("nora_cached_tasks");
        if (cached) {
          try { setTasks(JSON.parse(cached)); } catch (e) {}
        }
        fetchTasks(scriptUrl);
      }, []);

      const toggleTask = async (task) => {
        const newCompleted = !task.completed;
        const updatedTasks = tasks.map(t => t.id === task.id ? { ...t, completed: newCompleted } : t);
        setTasks(updatedTasks);
        localStorage.setItem("nora_cached_tasks", JSON.stringify(updatedTasks));

        if (newCompleted) {
          playChime();
          const quotes = [
            "Amaze! Amaze! Amaze! Task complete!",
            "Fist my bump! Astrophage reserve increased!",
            "Good! Proud! Trajectory nominal, Question?",
            "Engine burn confirmed! Saving Earth and Erid!"
          ];
          triggerToast(isSciFi ? quotes[Math.floor(Math.random() * quotes.length)] : `Completed: ${task.title}`);
        }

        if (!scriptUrl) return;
        setSyncStatus("Saving to Sheet...");
        try {
          const res = await jsonpRequest(scriptUrl, {
            action: "toggle",
            taskId: task.id,
            completed: newCompleted ? "true" : "false"
          });
          if (res && res.status === "ok") {
            setSyncStatus("Saved to Sheet ✓");
          } else {
            // Fallback to POST if user hasn't republished New Version of doGet yet
            await fetch(scriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({ taskId: task.id, completed: newCompleted })
            });
            setSyncStatus("Saved (Republish Script Version)");
          }
        } catch (err) {
          setSyncStatus("Save Error - Check Connection");
        }
      };

      const metrics = useMemo(() => {
        const total = tasks.length || 1;
        const completed = tasks.filter(t => t.completed).length;
        const pct = Math.round((completed / total) * 100);
        const dueThroughNow = tasks.filter(t => t.week <= calendarWeek);
        const expectedCount = dueThroughNow.length;
        const aheadBehind = completed - expectedCount;
        const thisWeekTasks = tasks.filter(t => t.week === activeAcademicWeek);
        const thisWeekDone = thisWeekTasks.filter(t => t.completed).length;

        const byCourse = {};
        Object.keys(COURSE_META).forEach(cid => {
          const cTasks = tasks.filter(t => t.courseId === cid);
          const cDone = cTasks.filter(t => t.completed).length;
          const cDueNow = cTasks.filter(t => t.week <= calendarWeek).length;
          byCourse[cid] = {
            total: cTasks.length,
            completed: cDone,
            pct: cTasks.length ? Math.round((cDone / cTasks.length) * 100) : 0,
            dueNow: cDueNow,
            delta: cDone - cDueNow,
            creditsAccrued: cTasks.length ? ((cDone / cTasks.length) * 0.5).toFixed(2) : "0.00"
          };
        });

        const totalCredits = Object.values(byCourse)
          .reduce((acc, c) => acc + parseFloat(c.creditsAccrued), 0)
          .toFixed(2);

        return {
          total: tasks.length,
          completed,
          pct,
          expectedCount,
          aheadBehind,
          thisWeekTotal: thisWeekTasks.length,
          thisWeekDone,
          byCourse,
          totalCredits
        };
      }, [tasks, calendarWeek, activeAcademicWeek]);

      const filteredTasks = useMemo(() => {
        return tasks.filter(t => {
          if (selectedCourse !== "all" && t.courseId !== selectedCourse) return false;
          if (searchQuery.trim() !== "") {
            const q = searchQuery.toLowerCase();
            if (!t.title.toLowerCase().includes(q) && !t.unit.toLowerCase().includes(q)) return false;
          }
          if (viewMode === "current_week") return t.week === activeAcademicWeek;
          if (viewMode === "catch_up") return t.week <= calendarWeek && !t.completed;
          if (viewMode === "by_week") return t.week === selectedWeek;
          return true;
        });
      }, [tasks, selectedCourse, searchQuery, viewMode, selectedWeek, activeAcademicWeek, calendarWeek]);

      const saveSettings = (e) => {
        e.preventDefault();
        localStorage.setItem("nora_script_url", scriptUrl.trim());
        setShowSettings(false);
        if (scriptUrl.trim()) fetchTasks(scriptUrl.trim());
      };

      const isOverdrive = metrics.aheadBehind >= 0 && metrics.completed > 0;

      return (
        <div className="max-w-5xl mx-auto px-4 py-6 pb-20">
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 border border-amber-500/60 text-amber-300 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
              <span className="text-xl">{isSciFi ? "🚀" : "✓"}</span>
              <span className="text-sm font-semibold">{toast}</span>
            </div>
          )}

          <header className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-slate-800">
            <div>
              <div className="flex items-center gap-2.5">
                <span className="inline-block w-3 h-3 rounded-full bg-amber-400 animate-pulse"></span>
                <span className="text-xs uppercase tracking-widest text-amber-400 font-semibold">
                  {isSciFi ? "Hail Mary Ship Log // Tau Ceti Trajectory" : "Grade 9 Academic Competency Record"}
                </span>
              </div>
              <h1 className="text-2xl sm:text-3xl font-bold text-white mt-1">
                {isSciFi ? "Astrophage Mission Control: Commander Nora" : "Nora Peak // Fall 2026 Curriculum Tracker"}
              </h1>
              <p className="text-xs text-slate-400 mt-0.5">
                {isSciFi
                  ? `Active Mission Week ${activeAcademicWeek} of ${TOTAL_WEEKS} • Sync: ${syncStatus}`
                  : `Active Week ${activeAcademicWeek} of ${TOTAL_WEEKS} (Calendar Wk ${calendarWeek}) • Sync: ${syncStatus}`}
              </p>
            </div>

            <div className="flex items-center gap-2 self-start sm:self-auto">
              <button
                onClick={() => setPersona(isSciFi ? "parent" : "hailmary")}
                className="px-3.5 py-2 rounded-lg text-xs font-semibold border transition bg-slate-900 border-slate-700 hover:border-amber-500/50 text-slate-200"
              >
                {isSciFi ? "Switch to Parent View" : "Switch to Hail Mary View"}
              </button>
              <button
                onClick={() => fetchTasks(scriptUrl)}
                className="p-2 rounded-lg bg-slate-900 border border-slate-700 hover:border-slate-500 text-slate-300 text-xs"
                title="Sync"
              >
                ↻
              </button>
              <button
                onClick={() => setShowSettings(!showSettings)}
                className="p-2 rounded-lg bg-slate-900 border border-slate-700 hover:border-slate-500 text-slate-300 text-xs"
                title="Settings"
              >
                ⚙️
              </button>
            </div>
          </header>

          {showSettings && (
            <form onSubmit={saveSettings} className="mt-4 p-4 rounded-xl bg-slate-900/90 border border-slate-700 space-y-3">
              <div className="flex items-center justify-between">
                <h2 className="text-sm font-semibold text-white">Google Apps Script URL</h2>
                <button type="button" onClick={() => setShowSettings(false)} className="text-xs text-slate-400 hover:text-white">Close</button>
              </div>
              <div className="flex gap-2">
                <input
                  type="url"
                  value={scriptUrl}
                  onChange={(e) => setScriptUrl(e.target.value)}
                  className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"
                />
                <button type="submit" className="px-4 py-2 bg-amber-500 text-slate-950 font-semibold rounded-lg text-xs">
                  Save & Sync
                </button>
              </div>
            </form>
          )}

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-6">
            <div className={`p-4 rounded-xl bg-slate-900/80 border ${isOverdrive ? "border-purple-500/60 overdrive-glow" : "border-slate-800"}`}>
              <div className="text-xs text-slate-400">{isSciFi ? "Astrophage Reserves" : "Total Tasks Completed"}</div>
              <div className="text-2xl font-bold text-white mt-1">
                {metrics.completed} <span className="text-sm font-normal text-slate-400">/ {metrics.total}</span>
              </div>
              <div className="w-full h-1.5 bg-slate-800 rounded-full mt-2 overflow-hidden">
                <div
                  className={`h-full rounded-full bg-gradient-to-r ${isOverdrive ? "from-purple-500 to-amber-400" : "from-amber-500 to-emerald-400"}`}
                  style={{ width: `${metrics.pct}%` }}
                ></div>
              </div>
            </div>

            <div className="p-4 rounded-xl bg-slate-900/80 border border-slate-800">
              <div className="text-xs text-slate-400">{isSciFi ? `Week ${activeAcademicWeek} Burn Target` : `Week ${activeAcademicWeek} Progress`}</div>
              <div className="text-2xl font-bold text-white mt-1">
                {metrics.thisWeekDone} <span className="text-sm font-normal text-slate-400">/ {metrics.thisWeekTotal}</span>
              </div>
              <div className="text-xs text-slate-400 mt-1.5">
                {metrics.thisWeekTotal - metrics.thisWeekDone === 0 && metrics.thisWeekTotal > 0
                  ? (isSciFi ? "Week Burn Complete!" : "All Week Tasks Done")
                  : `${metrics.thisWeekTotal - metrics.thisWeekDone} remaining in Wk ${activeAcademicWeek}`}
              </div>
            </div>

            <div className="p-4 rounded-xl bg-slate-900/80 border border-slate-800">
              <div className="text-xs text-slate-400">{isSciFi ? "Trajectory Status" : "Pacing vs. Schedule"}</div>
              <div className={`text-lg font-bold mt-1 ${metrics.aheadBehind >= 0 ? "text-emerald-400" : "text-amber-400"}`}>
                {metrics.aheadBehind >= 0
                  ? (isSciFi ? "Amaze! On Track" : `+${metrics.aheadBehind} Ahead of Pace`)
                  : (isSciFi ? "More Burn Needed" : `${Math.abs(metrics.aheadBehind)} Tasks Behind`)}
              </div>
              <div className="text-xs text-slate-400 mt-1">
                Target through Wk {calendarWeek}: {metrics.expectedCount}
              </div>
            </div>

            <div className="p-4 rounded-xl bg-slate-900/80 border border-slate-800">
              <div className="text-xs text-slate-400">{isSciFi ? "Eridian Mission Rating" : "Credits Accrued (Fall)"}</div>
              <div className="text-2xl font-bold text-white mt-1">
                {isSciFi ? `${metrics.pct}%` : `${metrics.totalCredits}`}
                <span className="text-xs font-normal text-slate-400 ml-1">{isSciFi ? "Velocity" : "/ 2.50 Cr"}</span>
              </div>
              <div className="text-xs text-slate-400 mt-1.5">
                {isSciFi ? "Rocky says: Fist my bump!" : "0.50 credit per course"}
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-5 gap-3 mt-4">
            {Object.values(COURSE_META).map(course => {
              const stat = metrics.byCourse[course.id] || { total: 0, completed: 0, pct: 0, delta: 0 };
              const isSelected = selectedCourse === course.id;
              return (
                <button
                  key={course.id}
                  onClick={() => setSelectedCourse(isSelected ? "all" : course.id)}
                  className={`text-left p-3.5 rounded-xl border transition ${
                    isSelected ? "bg-slate-800/90 border-amber-400" : "bg-slate-900/60 border-slate-800 hover:border-slate-700"
                  }`}
                >
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-white truncate">{isSciFi ? course.sciFiName : course.name}</span>
                    <span className="text-xs font-semibold text-amber-400">{stat.pct}%</span>
                  </div>
                  <div className="text-[11px] text-slate-400 truncate mt-0.5">{isSciFi ? course.name : course.curriculum}</div>
                  <div className="w-full h-1.5 bg-slate-800 rounded-full mt-2 overflow-hidden">
                    <div className={`h-full rounded-full bg-gradient-to-r ${course.color}`} style={{ width: `${stat.pct}%` }}></div>
                  </div>
                  <div className="flex items-center justify-between text-[11px] text-slate-400 mt-2">
                    <span>{stat.completed}/{stat.total} done</span>
                    <span className={stat.delta >= 0 ? "text-emerald-400" : "text-amber-400"}>
                      {stat.delta >= 0 ? `+${stat.delta} pace` : `${stat.delta} pace`}
                    </span>
                  </div>
                </button>
              );
            })}
          </div>

          <div className="mt-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-900/70 p-3 rounded-xl border border-slate-800">
            <div className="flex flex-wrap items-center gap-1.5">
              <button
                onClick={() => setViewMode("current_week")}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                  viewMode === "current_week" ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-300"
                }`}
              >
                Active Week (Wk {activeAcademicWeek})
              </button>
              <button
                onClick={() => setViewMode("catch_up")}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                  viewMode === "catch_up" ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-300"
                }`}
              >
                Catch-Up Queue (Wks 1-{calendarWeek})
              </button>
              <button
                onClick={() => setViewMode("by_week")}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                  viewMode === "by_week" ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-300"
                }`}
              >
                Browse by Week
              </button>
              <button
                onClick={() => setViewMode("by_course")}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                  viewMode === "by_course" ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-300"
                }`}
              >
                All Tasks
              </button>
            </div>

            <div className="flex items-center gap-2">
              {selectedCourse !== "all" && (
                <button onClick={() => setSelectedCourse("all")} className="text-xs text-amber-400 hover:underline px-2">
                  All Courses ✕
                </button>
              )}
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search lessons..."
                className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white w-full sm:w-48"
              />
            </div>
          </div>

          {viewMode === "by_week" && (
            <div className="mt-3 flex items-center gap-1.5 overflow-x-auto pb-2">
              {Array.from({ length: TOTAL_WEEKS }, (_, i) => i + 1).map(wk => (
                <button
                  key={wk}
                  onClick={() => setSelectedWeek(wk)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0 border transition ${
                    selectedWeek === wk
                      ? "bg-amber-500 text-slate-950 border-amber-400"
                      : wk === activeAcademicWeek
                      ? "bg-slate-800 text-amber-300 border-amber-500/40"
                      : "bg-slate-900 text-slate-400 border-slate-800"
                  }`}
                >
                  Wk {wk}
                </button>
              ))}
            </div>
          )}

          <div className="mt-4 space-y-2">
            {loading && tasks.length === 0 ? (
              <div className="p-12 text-center text-slate-400 text-sm bg-slate-900/40 rounded-xl border border-slate-800">
                Loading curriculum tasks...
              </div>
            ) : filteredTasks.length === 0 ? (
              <div className="p-10 text-center text-slate-400 text-sm bg-slate-900/40 rounded-xl border border-slate-800">
                {tasks.length === 0
                  ? "No tasks found. Ensure Code.gs is deployed as a New Version on the Master Task Tracker sheet."
                  : "Zero pending tasks in this filter!"}
              </div>
            ) : (
              filteredTasks.map(task => {
                const course = COURSE_META[task.courseId] || {
                  name: task.courseName,
                  sciFiName: task.courseName,
                  badge: "bg-slate-700 text-slate-200"
                };
                return (
                  <div
                    key={task.id}
                    onClick={() => toggleTask(task)}
                    className={`flex items-start gap-3.5 p-3.5 rounded-xl border cursor-pointer select-none transition ${
                      task.completed
                        ? "bg-slate-900/30 border-slate-800/80 opacity-65"
                        : "bg-slate-900/90 border-slate-800 hover:border-amber-500/50"
                    }`}
                  >
                    <input
                      type="checkbox"
                      checked={task.completed}
                      onChange={() => {}}
                      className="mt-1 w-5 h-5 rounded border-slate-600 cursor-pointer accent-amber-500"
                    />
                    <div className="flex-1 min-w-0">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-md border ${course.badge}`}>
                          {isSciFi ? course.sciFiName : course.name}
                        </span>
                        <span className="text-[11px] text-slate-400 font-medium">
                          Week {task.week} ({task.weekDates})
                        </span>
                        <span className="text-[11px] text-slate-500 truncate">
                          • {task.unit}
                        </span>
                      </div>
                      <div className={`text-sm font-medium mt-1 ${task.completed ? "line-through text-slate-500" : "text-slate-100"}`}>
                        {task.title}
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
