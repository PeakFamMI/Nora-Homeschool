<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nora - Homeschool Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .font-phm { font-family: 'Space Grotesk', monospace, sans-serif; }
    .font-parent { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const COURSES = [
      { id: 'geometry', name: 'Geometry', cat: 'STEM', target: 60 },
      { id: 'english9', name: 'English 9', cat: 'Humanities', target: 60 },
      { id: 'biology', name: 'Biology (with Lab)', cat: 'STEM', target: 60 },
      { id: 'ushistory', name: 'US History', cat: 'Humanities', target: 60 },
      { id: 'civics', name: 'Civics', cat: 'Humanities', target: 60 }
    ];

    function App() {
      // Toggle between 'phm' and 'standard'
      const [viewMode, setViewMode] = useState(() => localStorage.getItem('tracker_view_mode') || 'phm');
      const [webhookUrl, setWebhookUrl] = useState(() => localStorage.getItem('nora_webhook_url') || '');
      const [currentWeek, setCurrentWeek] = useState(2);
      const [activeTab, setActiveTab] = useState('deck');
      const [matrix, setMatrix] = useState(() => {
        const saved = localStorage.getItem('nora_hours_matrix');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return {
          geometry: { 2: 2.7 },
          english9: { 2: 1.2 },
          biology: { 2: 3.8 },
          ushistory: { 2: 0.8 },
          civics: { 2: 0.0 }
        };
      });
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStatus, setSyncStatus] = useState('Synced with Sheet');

      useEffect(() => {
        localStorage.setItem('tracker_view_mode', viewMode);
      }, [viewMode]);

      useEffect(() => {
        localStorage.setItem('nora_hours_matrix', JSON.stringify(matrix));
      }, [matrix]);

      // Calculate Course Totals
      const getCourseTotal = (courseId) => {
        const record = matrix[courseId] || {};
        return Object.values(record).reduce((a, b) => a + (parseFloat(b) || 0), 0);
      };

      const grandTotal = COURSES.reduce((acc, c) => acc + getCourseTotal(c.id), 0);
      const currentWeekTotal = COURSES.reduce((acc, c) => acc + (parseFloat(matrix[c.id]?.[currentWeek]) || 0), 0);
      const creditsEarned = (grandTotal / 60) * 0.5;

      const pullFromSheet = async () => {
        if (!webhookUrl) return;
        setIsSyncing(true);
        setSyncStatus('Reading sheet...');
        try {
          const res = await fetch(`${webhookUrl}?t=${Date.now()}`);
          const json = await res.json();
          if (json.status === 'ok' && json.matrix) {
            setMatrix(json.matrix);
            setSyncStatus('Synced with Sheet');
          } else {
            setSyncStatus('Sync warning');
          }
        } catch (err) {
          setSyncStatus('Offline / Cached');
        } finally {
          setIsSyncing(false);
        }
      };

      const pushToSheet = async (newMatrix) => {
        if (!webhookUrl) return;
        setIsSyncing(true);
        setSyncStatus('Updating sheet...');
        try {
          await fetch(webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ matrix: newMatrix })
          });
          setSyncStatus('Synced with Sheet');
        } catch (err) {
          setSyncStatus('Saved locally (Offline)');
        } finally {
          setIsSyncing(false);
        }
      };

      const adjustHours = (courseId, delta) => {
        const currentVal = parseFloat(matrix[courseId]?.[currentWeek]) || 0;
        const nextVal = Math.max(0, Math.round((currentVal + delta) * 10) / 10);
        const updated = {
          ...matrix,
          [courseId]: {
            ...(matrix[courseId] || {}),
            [currentWeek]: nextVal
          }
        };
        setMatrix(updated);
        pushToSheet(updated);
      };

      const isPHM = viewMode === 'phm';

      return (
        <div className={`p-4 md:p-8 max-w-5xl mx-auto ${isPHM ? 'font-phm' : 'font-parent'}`}>
          {/* Header */}
          <div className="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-5 mb-6 gap-4">
            <div>
              <div className="flex items-center gap-3">
                <span className="text-amber-500 text-2xl font-black">⚡</span>
                <h1 className="text-xl font-bold tracking-tight">
                  {isPHM ? 'HM-NORA // ORBITAL LOG' : "Nora's Homeschool Tracker"}
                </h1>
                {isPHM ? (
                  <span className="bg-amber-950 border border-amber-600/60 text-amber-400 text-xs px-2 py-0.5 rounded font-mono">TAU CETI</span>
                ) : (
                  <span className="bg-slate-800 text-slate-300 text-xs px-2.5 py-0.5 rounded-full font-medium">Grade 9 • Core Courses</span>
                )}
              </div>
              <p className="text-slate-400 text-xs mt-1">
                {isPHM ? 'Grade 9 Core Academic Telemetry' : 'Official Academic Time Log (300 Hour Floor)'}
              </p>
            </div>

            {/* View Switcher & Navigation */}
            <div className="flex flex-wrap items-center gap-2">
              {/* Dual Mode Toggle */}
              <button 
                onClick={() => setViewMode(isPHM ? 'standard' : 'phm')}
                className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium px-3 py-1.5 rounded-md flex items-center gap-1.5 transition"
                title="Switch between Teen / Parent view"
              >
                <span>👓</span>
                <span>{isPHM ? 'View: Standard English' : 'View: Hail Mary Mode'}</span>
              </button>

              <div className="flex bg-slate-900 border border-slate-800 rounded-lg p-1">
                <button
                  onClick={() => setActiveTab('deck')}
                  className={`px-3 py-1 rounded text-xs font-medium transition ${activeTab === 'deck' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}
                >
                  {isPHM ? 'Flight Deck' : 'Quick Log'}
                </button>
                <button
                  onClick={() => setActiveTab('grid')}
                  className={`px-3 py-1 rounded text-xs font-medium transition ${activeTab === 'grid' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}
                >
                  {isPHM ? 'Telemetry Grid' : 'Semester Matrix'}
                </button>
                <button
                  onClick={() => setActiveTab('config')}
                  className={`px-3 py-1 rounded text-xs font-medium transition ${activeTab === 'config' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}
                >
                  {isPHM ? 'Config' : 'Settings'}
                </button>
              </div>
            </div>
          </div>

          {/* Top Status Bar */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <div className="bg-slate-900/80 border border-slate-800/80 p-4 rounded-xl">
              <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">
                {isPHM ? 'Astrophage Reserve' : 'Total Hours Logged'}
              </div>
              <div className="text-2xl font-black text-white">
                {grandTotal.toFixed(1)} <span className="text-sm font-normal text-slate-500">/ 300.0h</span>
              </div>
              <div className="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                <div className="bg-amber-500 h-full rounded-full" style={{ width: `${Math.min(100, (grandTotal / 300) * 100)}%` }}></div>
              </div>
            </div>

            <div className="bg-slate-900/80 border border-slate-800/80 p-4 rounded-xl">
              <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">
                {isPHM ? 'Mission Phase' : 'Current Week'}
              </div>
              <div className="text-2xl font-black text-emerald-400">
                W{currentWeek} <span className="text-sm font-normal text-slate-500">of 18</span>
              </div>
              <div className="text-xs text-slate-400 mt-1">
                {currentWeekTotal.toFixed(1)}h logged this week
              </div>
            </div>

            <div className="bg-slate-900/80 border border-slate-800/80 p-4 rounded-xl">
              <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">
                {isPHM ? 'Trajectory' : 'Pacing Status'}
              </div>
              <div className="text-lg font-bold text-rose-400">
                {isPHM ? 'More Burn Needed' : 'Behind Target Pace'}
              </div>
              <div className="text-xs text-slate-400 mt-1">Floor: 16.7 hrs/week</div>
            </div>

            <div className="bg-slate-900/80 border border-slate-800/80 p-4 rounded-xl">
              <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">
                {isPHM ? 'Milestones' : 'Credits Accrued'}
              </div>
              <div className="text-2xl font-black text-slate-100">
                {creditsEarned.toFixed(2)} <span className="text-sm font-normal text-slate-500">/ 2.50</span>
              </div>
              <div className="text-xs text-slate-400 mt-1">60h per 0.50 Credit</div>
            </div>
          </div>

          {/* Sync Status Banner */}
          <div className="flex items-center justify-between text-xs px-3 py-1.5 bg-slate-900/40 border border-slate-800 rounded-lg mb-6">
            <span className="flex items-center gap-2">
              <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span className="text-slate-300">{syncStatus}</span>
            </span>
            <button 
              onClick={pullFromSheet} 
              disabled={isSyncing}
              className="text-amber-400 hover:text-amber-300 font-medium disabled:opacity-50"
            >
              {isSyncing ? 'Syncing...' : '↻ Refresh from Google Sheet'}
            </button>
          </div>

          {/* TAB 1: QUICK LOG / FLIGHT DECK */}
          {activeTab === 'deck' && (
            <div className="bg-slate-900/60 border border-slate-800/80 rounded-xl p-5">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <h2 className="text-sm font-bold tracking-wide uppercase text-slate-200">
                    {isPHM ? 'Propulsion Logging Console' : 'Weekly Course Hour Entry'}
                  </h2>
                  <p className="text-xs text-slate-400">
                    {isPHM ? 'Logged hours automatically sync to your Google Sheet in the background.' : 'Adjust hours for this week. Updates push directly to your Google Sheet.'}
                  </p>
                </div>
                <select
                  value={currentWeek}
                  onChange={(e) => setCurrentWeek(Number(e.target.value))}
                  className="bg-slate-950 border border-slate-700 text-amber-400 text-xs font-bold rounded-lg px-3 py-1.5"
                >
                  {Array.from({ length: 18 }, (_, i) => i + 1).map(w => (
                    <option key={w} value={w}>Week {w}</option>
                  ))}
                </select>
              </div>

              <div className="divide-y divide-slate-800">
                {COURSES.map(course => {
                  const weekHours = parseFloat(matrix[course.id]?.[currentWeek]) || 0;
                  const totalHours = getCourseTotal(course.id);
                  return (
                    <div key={course.id} className="py-3 flex items-center justify-between">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-sm font-semibold text-white">{course.name}</span>
                          <span className="text-[10px] uppercase font-bold px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">
                            {course.cat}
                          </span>
                        </div>
                        <div className="text-xs text-slate-400 mt-0.5">
                          {isPHM ? 'Burned' : 'Completed'}: {totalHours.toFixed(1)} / {course.target}.0h
                        </div>
                      </div>

                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => adjustHours(course.id, -0.5)}
                          className="w-8 h-8 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm flex items-center justify-center transition"
                        >-</button>
                        <span className="w-12 text-center text-sm font-mono font-bold text-amber-400">
                          {weekHours.toFixed(1)}h
                        </span>
                        <button
                          onClick={() => adjustHours(course.id, 0.5)}
                          className="px-2.5 h-8 rounded bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 font-bold text-xs border border-amber-500/40 transition"
                        >+0.5</button>
                        <button
                          onClick={() => adjustHours(course.id, 1.0)}
                          className="px-2.5 h-8 rounded bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs transition"
                        >+1h</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* TAB 2: SEMESTER MATRIX */}
          {activeTab === 'grid' && (
            <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-4 overflow-x-auto">
              <h2 className="text-sm font-bold tracking-wide uppercase text-slate-200 mb-3">
                {isPHM ? 'Telemetry Grid (18 Weeks)' : 'Full 18-Week Academic Matrix'}
              </h2>
              <table className="w-full text-xs text-left border-collapse">
                <thead>
                  <tr className="border-b border-slate-800 text-slate-400">
                    <th className="p-2">Course</th>
                    <th className="p-2 text-right">Total</th>
                    {Array.from({ length: 18 }, (_, i) => i + 1).map(w => (
                      <th key={w} className={`p-1 text-center ${w === currentWeek ? 'text-amber-400 font-bold' : ''}`}>
                        W{w}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800 font-mono">
                  {COURSES.map(course => (
                    <tr key={course.id} className="hover:bg-slate-800/40">
                      <td className="p-2 font-sans font-medium text-slate-200">{course.name}</td>
                      <td className="p-2 text-right font-bold text-amber-400">{getCourseTotal(course.id).toFixed(1)}h</td>
                      {Array.from({ length: 18 }, (_, i) => i + 1).map(w => {
                        const val = matrix[course.id]?.[w] || 0;
                        return (
                          <td key={w} className={`p-1 text-center ${w === currentWeek ? 'bg-amber-500/10' : ''}`}>
                            {val > 0 ? val : '-'}
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* TAB 3: CONFIG */}
          {activeTab === 'config' && (
            <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-5 space-y-4">
              <h2 className="text-sm font-bold tracking-wide uppercase text-slate-200">
                {isPHM ? 'Communication Telemetry Link' : 'Google Sheets Webhook Settings'}
              </h2>
              <div>
                <label className="block text-xs font-semibold text-slate-400 mb-1">Apps Script Web App URL</label>
                <input
                  type="text"
                  value={webhookUrl}
                  onChange={(e) => setWebhookUrl(e.target.value)}
                  placeholder="https://script.google.com/macros/s/.../exec"
                  className="w-full bg-slate-950 border border-slate-700 text-xs text-slate-200 p-2.5 rounded-lg focus:outline-none focus:border-amber-500"
                />
              </div>
              <button
                onClick={() => {
                  localStorage.setItem('nora_webhook_url', webhookUrl);
                  pullFromSheet();
                }}
                className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-4 py-2 rounded-md transition"
              >
                Save & Pull from Sheet
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
