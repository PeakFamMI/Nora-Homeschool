<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nora Peak // Academic Task Tracker</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --success: #10b981;
      
      --c-english: #f97316;
      --c-geometry: #38bdf8;
      --c-biology: #10b981;
      --c-history: #a855f7;
      --c-civics: #ec4899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    .container { max-width: 1100px; margin: 0 auto; }

    header { margin-bottom: 24px; }
    .badge { color: var(--accent); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .badge::before { content: ""; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
    h1 { font-size: 1.8rem; font-weight: 800; }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .metric-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 18px; }
    .metric-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
    .metric-value { font-size: 1.6rem; font-weight: 800; display: flex; align-items: baseline; gap: 6px; }
    .metric-sub { font-size: 0.85rem; color: var(--text-muted); font-weight: normal; }
    .metric-footer { font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; }

    .progress-bar-bg { width: 100%; height: 6px; background: #1f2937; border-radius: 3px; overflow: hidden; margin-top: 10px; }
    .progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

    .courses-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .course-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 14px; }
    .course-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .course-name { font-size: 0.85rem; font-weight: 700; }
    .course-percent { font-size: 0.85rem; font-weight: 700; }
    .course-sub { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .course-footer { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; }

    .nav-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .nav-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn { background: #1f2937; color: var(--text); border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .tab-btn.active { background: var(--accent); color: #000; }
    .search-input { background: #111827; border: 1px solid var(--card-border); color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; min-width: 200px; }

    .week-scroller { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: thin; }
    .week-pill { background: #111827; border: 1px solid var(--card-border); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
    .week-pill:hover { border-color: var(--accent); }
    .week-pill.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .week-pill.current { outline: 1px dashed var(--accent); }

    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 14px 16px; display: flex; align-items: flex-start; gap: 14px; }
    .task-checkbox { margin-top: 3px; width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }
